<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wash PDF - Cadastro de Cliente</title>
    <link rel="stylesheet" href="./styles/cadastro.css">
</head>

<body>
        <main>
            <h1 class="titulo-index">Wash PDV</h1>
            <p class="sub-tit-index">Plataforma de Gestão de Estética Automotiva</p>
            <hr>
            <p class="sub-tit-index">Realizar Cadastro do Cliente</p>

            <form action="/cadastrar-cliente" method="POST">

                <table align="center">
                    <tr>
                        <td>
                            <fieldset>
                                <legend>Cadastro:</legend>

                                <table>
                                    <tr>
                                        <td align="left">
                                            <label for="nome">Nome:</label>
                                        </td>

                                        <td align="left">
                                            <input type="text" name="nome" id="nome" required>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td align="left">
                                            <label for="contato">Contato:</label>
                                        </td>

                                        <td align="left">
                                            <input type="contato" name="contato" id="contato" required
                                                placeholder="(XX)99999-9999">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td align="left">
                                            <label for="email">Email:</label>
                                        </td>

                                        <td align="left">
                                            <input type="email" name="email" id="email" required
                                                placeholder="seu-email@email.com">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td align="left">
                                            <label for="username">Usuário:</label>
                                        </td>

                                        <td align="left">
                                            <input type="text" name="username" id="username" autocomplete="username"
                                                required>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td align="left">
                                            <label for="senha">Senha:</label>
                                        </td>

                                        <td align="left">
                                            <input type="password" name="senha" id="senha" minlength="8" required>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td align="left">
                                            <label for="endereco">Endereço:</label>
                                        </td>

                                        <td align="left">
                                            <textarea name="endereco" id="endereco" rows="4"
                                                placeholder="Rua XPTO, número 123, CEP 12456-123"></textarea>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td align="left">
                                            <label for="estado">Estado: </label>
                                        </td>

                                        <td align="left">
                                            <select name="lista-estados" id="lista-estados">
                                                <option value="">Selecione o Estado (UF)</option>
                                                <option value="AC">Acre (AC)</option>
                                                <option value="AL">Alagoas (AL)</option>
                                                <option value="AP">Amapá (AP)</option>
                                                <option value="AM">Amazonas (AM)</option>
                                                <option value="BA">Bahia (BA)</option>
                                                <option value="CE">Ceará (CE)</option>
                                                <option value="DF">Distrito Federal (DF)</option>
                                                <option value="ES">Espírito Santo (ES)</option>
                                                <option value="GO">Goiás (GO)</option>
                                                <option value="MA">Maranhão (MA)</option>
                                                <option value="MT">Mato Grosso (MT)</option>
                                                <option value="MS">Mato Grosso do Sul (MS)</option>
                                                <option value="MG">Minas Gerais (MG)</option>
                                                <option value="PA">Pará (PA)</option>
                                                <option value="PB">Paraíba (PB)</option>
                                                <option value="PR">Paraná (PR)</option>
                                                <option value="PE">Pernambuco (PE)</option>
                                                <option value="PI">Piauí (PI)</option>
                                                <option value="RJ">Rio de Janeiro (RJ)</option>
                                                <option value="RN">Rio Grande do Norte (RN)</option>
                                                <option value="RS">Rio Grande do Sul (RS)</option>
                                                <option value="RO">Rondônia (RO)</option>
                                                <option value="RR">Roraima (RR)</option>
                                                <option value="SC">Santa Catarina (SC)</option>
                                                <option value="SP">São Paulo (SP)</option>
                                                <option value="SE">Sergipe (SE)</option>
                                                <option value="TO">Tocantins (TO)</option>
                                            </select>
                                        </td>
                                    </tr>
                                </table>

                            </fieldset>
                        </td>
                    </tr>
                </table>
                <br>

                <div>
                    <button type="submit" class="default-btn">Enviar Cadastro</button>
                    <button type="reset" class="default-btn">Limpar Campos</button>
                </div>

            </form>

            <form action="index.html">
                <button type="submit" class=" default-btn back">Voltar</button>
            </form>

        </main>

</body>

</html>
